  # Blind boxes (Open Box)
  - id: blind-box.math
    feature: blind-box
    what: The rule that works out how many blind boxes a player has earned and how many they can still collect.
    try_it: Run `pytest -k game_070` and `pytest -k game_071`. Every test should pass, including the worked examples from the game rules. Try a player who already collected all their boxes and check that the count of boxes left to collect is zero.
    needs: [points.ledger]
    open: []
    area: backend
    size: S
    level: easy
    safety_review: false
    rules: [GAME-070, GAME-071, GAME-074, DATA-031]
    learn: how to test a small pure function with the worked examples
  - id: blind-box.open-box
    feature: blind-box
    what: A page that shows a player how many blind boxes they can collect and how to go and get them.
    try_it: Log in as Test Player 1 and tap Open Box. You should see how many boxes can be collected and clear steps for going to the game booth. Check that the page never says how many boxes are left in total, and that tapping Open Box does not use up a box.
    needs: [blind-box.math]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: false
    rules: [GAME-073, GAME-077]
    learn: how a page explains a real-world step clearly
  - id: blind-box.claim
    feature: blind-box
    what: An usher hands a player a blind box and the game remembers it, so the same box is never given twice.
    try_it: Log in as Test Usher, scan Test Player 1's code after they have reached a box milestone, and save the claim. Test Player 1's phone should now show one fewer box to collect. Then pause the game as Test Admin and try again, which should be refused, and try claiming more boxes than the player has earned, which should also be refused.
    needs: [usher.scan, blind-box.math, game-state.core]
    open: []
    area: admin-screens
    size: M
    level: medium
    safety_review: true
    rules: [GAME-073, GAME-075, GAME-102, DATA-026, DATA-029]
    learn: how to stop two ushers from claiming the same blind box at once
  - id: blind-box.stock
    feature: blind-box
    what: When all the blind boxes have been given out, the game stops letting anyone collect more.
    try_it: Run `pytest -k game_076`. It should pass. On a local run, set the stock in the test config to a tiny number, claim until it is used up, and the next claim should be refused with a friendly message. Check that the phone still shows no count of boxes left.
    needs: [blind-box.claim]
    open: []
    area: backend
    size: S
    level: medium
    safety_review: false
    rules: [GAME-076]
    learn: how a config value turns a check on
  - id: blind-box.close-redemption
    feature: blind-box
    what: On Sunday the game is off, but players can still collect their blind boxes until an admin presses a button to close collecting.
    try_it: With the game set to off, log in as Test Usher and claim a box for Test Player 1, which should work. Then log in as Test Admin, tap Close redemption, and try another claim, which should now be refused. Also check that points still cannot be earned while the game is off.
    needs: [blind-box.claim, game-state.admin-switch]
    open: []
    area: admin-screens
    size: M
    level: medium
    safety_review: true
    rules: [GAME-078, GAME-108, GAME-110, API-020]
    learn: how one narrow exception is added to a rule without weakening it

