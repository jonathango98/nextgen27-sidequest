  # Game day readiness
  - id: ready.logout
    feature: ready
    what: A way to sign out on this phone only, so the next person who picks it up cannot be you.
    try_it: On a phone, log in as Test Player 1, tap log out, then try to open a player page. You should be sent back to the log in or join page. Try to break it by logging in on a second phone first, and check that one stays signed in after the first phone logs out.
    needs: [auth.join-login]
    open: []
    area: backend
    size: S
    level: easy
    safety_review: true
    rules: [ARCH-034]
    learn: how a signed session cookie is cleared
  - id: ready.rate-limits
    feature: ready
    what: Stops someone from trying to log in or sign up too many times too fast from the same place. This makes guessing someone's PIN much harder.
    try_it: On a local run or PR preview, type a wrong PIN for the log in over and over, quickly, using different Test Players. After too many tries you should get a slow down message instead of a normal wrong PIN message. Wait a bit and check log in works again, and never do this on production.
    needs: [auth.join-login]
    open: [ARCH-031]
    area: backend
    size: M
    level: hard
    safety_review: true
    rules: [ARCH-031]
    learn: how rate limits slow down PIN guessing
  - id: ready.backups
    feature: ready
    what: Railway makes safe copies of the game's data on a schedule, and we prove a copy can bring everything back if something goes wrong.
    try_it: On staging, never production, make a Railway backup, then join as Test Player 9 and restore the backup. Test Player 1 should still log in and Test Player 9 should be gone, which proves the restore worked. Write down how long the restore took.
    needs: [app.foundation]
    open: [ARCH-053]
    area: infra
    size: M
    level: hard
    safety_review: true
    rules: [ARCH-053]
    learn: how to back up SQLite safely while it runs
  - id: ready.load-test
    feature: ready
    what: A test that pretends hundreds of phones join the game at the same moment, to see if the app stays fast enough on staging.
    try_it: Run the load test command against staging, never production, and wait for it to finish. It should print a summary showing how fast the pages answered and whether any failed. Check the staging app still opens normally on a phone afterward.
    needs: [auth.join-login]
    open: [ARCH-072]
    area: infra
    size: M
    level: hard
    safety_review: false
    rules: [ARCH-070, ARCH-071, ARCH-072, OPS-030]
    learn: how to measure the p95 response time under load
  - id: ready.retention
    feature: ready
    what: A cleanup that wipes everyone's personal data once the keep-until date has passed, so players are protected after the event.
    try_it: Run the cleanup on staging or a local copy, never on production data, with the date set to just after the keep-until date. It should report what it removed. Then try to log in as Test Player 1 and check that player is gone. Also run it before the date and check nothing is removed.
    needs: [points.audit-log]
    open: [SAFE-014]
    area: backend
    size: M
    level: hard
    safety_review: true
    rules: [SAFE-014, ARCH-052, DATA-015, WRAP-004]
    learn: how data retention protects players after the event
