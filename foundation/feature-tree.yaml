# Side Quest feature tree (every feature, split into pieces, with what each piece needs first)
#
# Status: Active
# Owner: Jonathan (@jonathango98)
# Version: 1.3.0
# Last updated: 2026-10-27
# Protected file. Changes go in a PR that Jonathan approves (ENG-080).
#
# How to read this file (rules in 16-feature-tree.md, ENG-105 to ENG-109)
# - A piece is one branch, one PR. Its id looks like "points.ledger".
# - what: what the piece does, in words a 10-year-old understands. The rules list has the details.
# - try_it: what to test by hand once it's built, so you know it works. Never a game number (AI-013).
# - This file holds the plan only. Live status is in the README Project status (ENG-100).
#   A piece is Working when its id is in the README Working table, or in already_working below.
# - A piece is unlocked when every id in "needs" is Working and no rule in "open" is still
#   listed in 13-decisions.md section 3 (AI-003).
# - size: S fits one agent session. M takes about two sessions. Nothing is bigger (ENG-106).
# - level: how much coding experience it takes (easy, medium, hard).
# - area: backend, player-app, admin-screens, design, infra (labels in 09 section 5).
# - safety_review: true means the PR needs the safety-review label and a second reviewer (SAFE-016).
# - Same format rules as game-config.yaml: plain maps, strings, lists, true or false. No anchors (ENG-030).

# Pieces that were Working before this file existed. Other pieces can need them.
already_working:
  - id: app.foundation
    what: The game starts up, reads its settings, sets up its storage, and gives every player page the same look and frame.
  - id: infra.hosting
    what: A practice copy of the game online for testing, and a fresh temporary copy for every change someone proposes, checked in a real browser.
  - id: auth.join-login
    what: Players join with a name, church, and PIN, and can log in on another phone. If someone guesses the PIN wrong too many times, they get locked out for a while.
  - id: code.my-code
    what: Each player gets a personal QR code that keeps changing, and a My Code page to show it so others can scan it.
  - id: screens.skeleton
    what: Every player screen exists as a plain page, and the buttons to move between them all work.

features:
  - id: staff
    name: Staff accounts and roles
    milestone: Core build
  - id: game-state
    name: Game states and pause
    milestone: Core build
  - id: points
    name: Points service
    milestone: Core build
  - id: connections
    name: Scanner and connections, with icebreaker
    milestone: Core build
  - id: look
    name: Mix look on player screens
    milestone: January build
  - id: home
    name: Home and Quests pages
    milestone: January build
  - id: checkin
    name: Session check-in
    milestone: January build
  - id: explore
    name: Explore
    milestone: January build
  - id: journal
    name: Journal and Summary page
    milestone: January build
  - id: blind-box
    name: Blind boxes (Open Box)
    milestone: January build
  - id: leaderboards
    name: Leaderboards and church score
    milestone: January build
  - id: usher
    name: Usher console
    milestone: January build
  - id: admin
    name: Admin console
    milestone: January build
  - id: screen
    name: Main screen views (leaderboards, takeaway wall, check-in QR, paused)
    milestone: January build
  - id: wrapped
    name: Wrapped cards
    milestone: January build
  - id: recap
    name: Conference recap screen
    milestone: January build
  - id: ready
    name: Game day readiness (log out, rate limits, backups, load test, data cleanup)
    milestone: Before Playtest 2

pieces:
  # Staff accounts and roles
  - id: staff.accounts
    feature: staff
    what: A safe place to keep the accounts of ushers and admins, with passwords nobody can read. Also a way to make the very first admin when the game is set up.
    try_it: On a local run, set the first admin's password in the environment and run the create-admin server command named in the PR. You should see a message that the admin was made, and the password should not show up anywhere in the output. Try to break it by running the command twice, you should not get two copies of the same admin.
    needs: [app.foundation]
    open: []
    area: backend
    size: M
    level: hard
    safety_review: true
    rules: [ARCH-035, ARCH-036, ARCH-030]
    learn: how to add a table with a numbered SQL migration and store passwords safely
  - id: staff.login
    feature: staff
    what: A login page for ushers and admins. Each staff page checks who you are and turns you away if your job is the wrong one.
    try_it: Open the staff login page on a local run and log in as the first admin, you should land on an admin page. Then log in as Test Usher and open an admin page, you should be told you are not allowed. Also try opening a staff page while logged out, you should be sent to log in.
    needs: [staff.accounts]
    open: []
    area: backend
    size: M
    level: hard
    safety_review: true
    rules: [ARCH-035, ARCH-036, API-020]
    learn: how one check protects every usher and admin page
  - id: staff.manage
    feature: staff
    what: An admin page where an admin can add a new usher or screen account and switch one off. Every change is written in the game's notebook.
    try_it: Log in as an admin, add an account called Test Usher, then log in as Test Usher on another phone, you should get in. Switch that account off and try again, the login should now be refused. Try to break it by opening this page as Test Usher, you should be turned away.
    needs: [staff.login, points.audit-log]
    open: []
    area: admin-screens
    size: S
    level: medium
    safety_review: true
    rules: [ARCH-036, GAME-110, ARCH-050]
    learn: how an admin form writes an audit row
  - id: staff.screen-mode
    feature: staff
    what: An admin can set up a big main screen so it can only show the screens meant for everyone to see. Nothing private can show up on it.
    try_it: Log in as an admin on a laptop, switch it to screen mode, then open a main screen page, you should see it. Now try to open an admin page or a player's private page in the same browser, you should be refused.
    needs: [staff.login]
    open: []
    area: admin-screens
    size: S
    level: medium
    safety_review: true
    rules: [ARCH-037]
    learn: how a limited session differs from a full login

  # Game states and pause
  - id: game-state.core
    feature: game-state
    what: One big switch that says if the game is on, paused, or off. When it is paused or off, nothing that earns points is allowed to work.
    try_it: Run `pytest -k game_100` (or the game state tests named in the PR). With the game on, an earning action should work. With the game set to paused or off, the same action should be refused with the paused or game off answer. Try to break it by switching the game state in the test and trying again right away, the new state should apply to the very next request.
    needs: [app.foundation]
    open: []
    area: backend
    size: M
    level: medium
    safety_review: false
    rules: [ARCH-041, ARCH-042, GAME-100, GAME-102, GAME-108, API-020, DATA-013]
    learn: how one shared switch changes what every route allows
  - id: game-state.banner
    feature: game-state
    what: A friendly note at the top of every player page when the game is paused. When the game is off, the sign-up page tells new players that it is closed.
    try_it: On a local run or PR preview, join as Test Player 1 and pause the game, then open Home, My Code and Quests, you should see a short paused note on each page. Switch the game off and open the sign-up page in a new private tab, you should see that sign-up is closed.
    needs: [game-state.core]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: false
    rules: [UI-033, GAME-108]
    learn: how a shared template partial shows on every page
  - id: game-state.admin-switch
    feature: game-state
    what: Buttons for an admin to start the game, pause it, or turn it off. Each press is written in the game's notebook.
    try_it: Log in as an admin and press Pause, the page should show the new state without a full reload. Open a player page as Test Player 1 on another phone, you should see the paused note. Try to break it by pressing a button as Test Usher, you should be refused.
    needs: [game-state.core, staff.login, points.audit-log]
    open: []
    area: admin-screens
    size: S
    level: medium
    safety_review: true
    rules: [GAME-101, GAME-104, GAME-110, OPS-001, ARCH-050]
    learn: how an HTMX button posts to the server and swaps part of the page
  - id: game-state.auto-pause
    feature: game-state
    what: An admin types in when each session starts, and the game pauses by itself at that time if it is on. It never turns on a game that is off, and never un-pauses it.
    try_it: As an admin, add a session whose start time is a minute or two from now, with the game on. Wait for that time and refresh a player page, you should see the paused note. Try to break it by setting the game to off before the time arrives, it should stay off and not become paused.
    needs: [checkin.sessions, game-state.admin-switch]
    open: []
    area: backend
    size: M
    level: medium
    safety_review: true
    rules: [GAME-107, DATA-014, OPS-001]
    learn: how a server runs a timed job without missing or repeating it

  # Points service
  - id: points.audit-log
    feature: points
    what: A notebook the game writes in every time something important happens. Nobody can erase or change what's written.
    try_it: Run `pytest -k audit` (or the test names in the PR). You should see that writing a note works and that trying to change or delete a note fails. Also check that the notes never contain PINs, secret answers, or other private words.
    needs: [app.foundation]
    open: []
    area: backend
    size: S
    level: medium
    safety_review: true
    rules: [ARCH-050, DATA-015, ARCH-051]
    learn: why some records are written once and never changed
  - id: points.ledger
    feature: points
    what: The one place where every point is given out. It checks the game is not paused, no limit is passed, and nobody gets the same points twice, then writes it down.
    try_it: Run `pytest -k points` and expect every test to pass. The tests should show that a good award is saved once, an award while paused is refused, and an award repeated by mistake is not given twice. Try to break it with two awards sent at the same moment, the player should still get the points only once.
    needs: [points.audit-log, game-state.core]
    open: []
    area: backend
    size: M
    level: hard
    safety_review: false
    rules: [ARCH-040, AI-040, AI-041, GAME-002, GAME-003, GAME-004, GAME-005, DATA-027, DATA-030]
    learn: how a database transaction keeps points correct when two phones tap at once
  - id: points.score-bar
    feature: points
    what: The bar at the top of every player page now shows the player's real score. It matches what the game has written down.
    try_it: Join as Test Player 1 on one phone and look at the top bar, then earn points any way the build allows and open another page. The number should be the same on every page and match the real total. Try to break it by refreshing a few times, the score should not change by itself.
    needs: [points.ledger]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: false
    rules: [UI-030, GAME-003, DATA-030]
    learn: how a page reads a total from the server
  - id: points.join
    feature: points
    what: When a new player signs up, they get the points for joining the game, one time only.
    try_it: On a local run or PR preview, sign up as Test Player 1, you should see the points for joining in the score bar. Log out and log in again, the score should not go up a second time. Run `pytest -k game_040` to check the same thing.
    needs: [points.ledger]
    open: [GAME-044]
    area: backend
    size: S
    level: medium
    safety_review: true
    rules: [GAME-040, GAME-044]
    learn: how a quest calls the points service

  # Scanner and connections, with icebreaker
  - id: connections.table
    feature: connections
    what: The game's memory for who met whom and which churches each person has met. It is built so the same two people can never be saved as a pair twice.
    try_it: Run the server's migration step on a fresh local database, then `pytest -k connection`. You should see the new tables created and the tests pass. Try to break it by saving the same pair twice, even in the opposite order, the second one should be refused.
    needs: [app.foundation]
    open: []
    area: backend
    size: S
    level: medium
    safety_review: true
    rules: [DATA-020, DATA-021, SAFE-016]
    learn: how database constraints stop the same pair from counting twice
  - id: connections.scanner-camera
    feature: connections
    what: The Scan page opens the phone's camera and reads QR codes. If it is not a Side Quest code, it says so.
    try_it: On a real phone with a PR preview, join as Test Player 1, open Scan and allow the camera. Point it at a Side Quest code, you should see it read the code. Point it at any other QR code, you should see a message that it is not a Side Quest code.
    needs: [screens.skeleton]
    open: []
    area: player-app
    size: M
    level: medium
    safety_review: false
    rules: [ARCH-025, ARCH-004, UI-034]
    learn: how a phone browser reads a QR code with the camera
  - id: connections.scan-save
    feature: connections
    what: When one player scans another player's code, the game saves that they met. It says no if you scan yourself, scan an old code, or scan someone you already met.
    try_it: Join as Test Player 1 and Test Player 2 on two phones, then scan Test Player 2's My Code from Test Player 1. You should see that they met. Scan again, scan your own code, or wait for a code to run out, each should be refused with a clear message.
    needs: [connections.table, connections.scanner-camera, code.my-code]
    open: []
    area: backend
    size: M
    level: hard
    safety_review: true
    rules: [GAME-013, GAME-014, ARCH-026, API-020]
    learn: how the server checks a signed, time-limited code
  - id: connections.incoming
    feature: connections
    what: Your My Code page shows a note when someone scans you, without you tapping anything.
    try_it: Open My Code as Test Player 2 on one phone, then scan that code from Test Player 1 on another phone. Within a few seconds the first phone should show that someone scanned them. Try to break it by scanning again, the note should not show up twice for the same pair.
    needs: [connections.scan-save]
    open: []
    area: player-app
    size: S
    level: medium
    safety_review: false
    rules: [API-030, API-032]
    learn: how HTMX polling updates part of a page
  - id: connections.points
    feature: connections
    what: Each player gets points for meeting someone when they save their friend's answer. Friends from the same church get fewer points, and meeting a new church gives a bonus. The points service gives them out.
    try_it: "Run `pytest -k 'game_010 or game_011 or game_012 or game_018'` and expect the worked examples from the rules to pass. By hand, connect Test Player 1 from Example Church A with Test Player 2 from Example Church B, then save an answer on Test Player 1's phone. Only Test Player 1's score should go up, by the connection points plus the new church bonus in game-config.yaml. Then connect two players from the same church, they should get the smaller same-church points."
    needs: [connections.scan-save, points.ledger]
    open: [GAME-016]
    area: backend
    size: M
    level: hard
    safety_review: false
    rules: [GAME-010, GAME-011, GAME-012, GAME-018]
    learn: how worked examples in the rules become tests
  - id: connections.icebreaker-question
    feature: connections
    what: After a scan, both phones show the same fun question to talk about, like a favorite food.
    try_it: Scan between Test Player 1 and Test Player 2 on two phones. Both phones should show the friend's name and church, and the very same question. Try to break it by scanning the same pair again, they should not get a new question.
    needs: [connections.scan-save]
    open: [GAME-019]
    area: player-app
    size: S
    level: medium
    safety_review: false
    rules: [GAME-017, SAFE-043]
    learn: how two players see the same thing from one saved record
  - id: connections.icebreaker-answer
    feature: connections
    what: Each player can type in the answer their new friend gave. Only those two players can ever see it.
    try_it: After a scan, type an answer for Test Player 2 on Test Player 1's phone, you should see it saved. Log in as Test Usher or an admin and look for that answer, it should not appear anywhere. Try to break it by logging in as Test Player 3 and opening that connection, you should be refused.
    needs: [connections.icebreaker-question]
    open: [GAME-015, GAME-019]
    area: player-app
    size: M
    level: hard
    safety_review: true
    rules: [GAME-015, SAFE-006]
    learn: how to keep private data visible to exactly two people
  - id: connections.verse-picker
    feature: connections
    what: When the question is about a favorite verse, players choose the book, chapter and verse from lists instead of typing. It saves as something like John 3:16.
    try_it: Scan between two test players until you get the favorite verse question. Choose a book, chapter and verse from the lists, you should see it saved in the usual form. Try to break it by picking a chapter that is too high for that book, the lists should not let you.
    needs: [connections.icebreaker-answer]
    open: []
    area: player-app
    size: S
    level: medium
    safety_review: false
    rules: [WRAP-012, GAME-019]
    learn: how a fixed list of choices keeps data clean enough to match

  # Mix look on player screens
  - id: look.frame
    feature: look
    what: The frame around every player screen in the chosen design, with the score bar on top, the buttons at the bottom, and a glowing, grainy background.
    try_it: Open Home, My Code and Quests at 360px wide. The top bar, bottom bar and background should look the same on each, with no sideways scrolling or console errors.
    needs: [screens.skeleton]
    open: []
    area: design
    size: M
    level: easy
    safety_review: false
    rules: [UI-008, UI-009, UI-030, DEC-035, DEC-036]
    learn: how design tokens in CSS keep every screen consistent
  - id: look.components
    feature: look
    what: Building blocks like buttons, cards and progress bars in the chosen design, ready for every screen to reuse.
    try_it: Open the page that shows the components at 360px wide. Each button, card and bar should match the mockup, and tapping buttons should work. There should be no console errors.
    needs: [look.frame]
    open: []
    area: design
    size: S
    level: easy
    safety_review: false
    rules: [UI-035, UI-051]
    learn: how one template partial becomes a reusable component
  - id: look.home
    feature: look
    what: The Home screen made to look like the chosen design, with pretend numbers for now.
    try_it: Open Home on a phone or a browser 360px wide. It should match the mockup, nothing should spill off the side, and there should be no red errors in the browser console.
    needs: [look.components]
    open: []
    area: design
    size: S
    level: easy
    safety_review: false
    rules: [UI-036, DEC-037]
    learn: how to turn a mockup into a page at 360px
  - id: look.code
    feature: look
    what: The My Code screen made to look like the chosen design, with the QR code and a black Scan button.
    try_it: Open My Code at 360px wide as Test Player 1. The QR panel and the black Scan button should match the mockup and fit on screen, the Scan button should open the scanner, and there should be no console errors.
    needs: [look.components]
    open: []
    area: design
    size: S
    level: easy
    safety_review: false
    rules: [UI-037, DEC-037]
    learn: how to turn a mockup into a page at 360px
  - id: look.summary
    feature: look
    what: The page of shared notes made to look like the chosen design, filled with fake note cards.
    try_it: Open the summary page at 360px wide. The fake cards should match the mockup, text should wrap with nothing cut off, and there should be no console errors.
    needs: [look.components]
    open: []
    area: design
    size: S
    level: easy
    safety_review: false
    rules: [UI-038, DEC-037]
    learn: how to turn a mockup into a page at 360px

  # Home and Quests pages
  - id: home.progress
    feature: home
    what: Home shows the player's real score and how close they are to the next blind box.
    try_it: Join as Test Player 1 and see the starting score on Home. Earn points (like a check-in) and refresh, the score and the progress bar should go up. Try a brand new player, it should show zero without breaking.
    needs: [points.ledger, blind-box.math]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: false
    rules: [GAME-070, GAME-071, UI-036, UI-051]
    learn: how a page reads computed numbers from a service
  - id: home.quests
    feature: home
    what: A Quests page that lists every quest and how many points each one gives.
    try_it: Join as Test Player 1 and open Quests on a phone. Every quest should show with its points. Change one points number in game-config.yaml, restart, and the page should show the new number without touching any page file.
    needs: [points.ledger]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: false
    rules: [AI-013, ENG-031]
    learn: why game numbers come from config and never from the template

  # Session check-in
  - id: checkin.sessions
    feature: checkin
    what: A list of the conference sessions, and an admin page to add a new one by giving it a title.
    try_it: Log in as a Test Admin, add a session called Example Session 1, and edit its title. It should show in the list after a refresh. Run `pytest -k checkin` and expect it to pass.
    needs: [staff.login, points.audit-log]
    open: []
    area: admin-screens
    size: M
    level: medium
    safety_review: true
    rules: [DATA-014, DATA-022, GAME-110]
    learn: how an admin list page adds and edits rows
  - id: checkin.end-session
    feature: checkin
    what: An admin button that ends a session. It opens check-in for that session and turns the game on.
    try_it: Log in as a Test Admin with the game paused and press End session on Example Session 1. Check-in should open and the game should now be on. Pressing it again should not break anything.
    needs: [checkin.sessions, game-state.admin-switch]
    open: []
    area: admin-screens
    size: S
    level: medium
    safety_review: true
    rules: [GAME-021, GAME-026, OPS-002]
    learn: how one button changes two things in one transaction
  - id: checkin.hall-code
    feature: checkin
    what: The big hall screen shows a check-in code that keeps changing, so a photo of it soon stops working.
    try_it: Open the main screen for a session and watch the code. It should change on its own after a short wait. Try to break it by scanning an old code you saved, which should be refused.
    needs: [checkin.sessions, screen.shell, code.my-code]
    open: []
    area: admin-screens
    size: S
    level: medium
    safety_review: true
    rules: [GAME-020, DEC-013]
    learn: how the QR service makes a different kind of code
  - id: checkin.scan
    feature: checkin
    what: A player scans the code on the hall screen to check in. The first players to check in get the most points.
    try_it: Join as Test Player 1 on one phone and scan the hall code of a session that is open. You should see a points message. Try to break it by scanning again (no new points) and by scanning before check-in is open (refused).
    needs: [checkin.hall-code, connections.scanner-camera, points.ledger]
    open: []
    area: backend
    size: M
    level: hard
    safety_review: false
    rules: [GAME-022, GAME-023, GAME-025]
    learn: how save order decides tiers when many phones scan at once
  - id: checkin.close
    feature: checkin
    what: An admin button that stops check-in for a session whenever they choose.
    try_it: Log in as a Test Admin, open check-in for Example Session 1, then press the close button. Now Test Player 1 scanning the hall code should be refused.
    needs: [checkin.end-session]
    open: []
    area: admin-screens
    size: S
    level: easy
    safety_review: true
    rules: [GAME-024]
    learn: how to build only the decided part of a rule (no automatic close)

  # Journal and Summary page
  - id: journal.table
    feature: journal
    what: A safe place in the database to keep players' notes. It goes in its own change because it holds writing from young people.
    try_it: Run `pytest -k journal` and expect it to pass. Start the app on an empty database, it should start with no errors.
    needs: [checkin.sessions]
    open: []
    area: backend
    size: S
    level: medium
    safety_review: true
    rules: [DATA-023, SAFE-016]
    learn: why tables that hold minors' writing get their own review
  - id: journal.write
    feature: journal
    what: Lets a player write a private note about what they learned in a session that has finished. They get points once for each session, but not while the game is paused.
    try_it: Join as Test Player 1, open Journal for an ended session, and send a note with too few words, you should see a friendly message. Then send a long enough note, you should get the points once. Try to break it by writing a second note for the same session (no new points) and by pausing the game first (it should say no).
    needs: [journal.table, points.ledger, checkin.end-session]
    open: []
    area: player-app
    size: M
    level: medium
    safety_review: true
    rules: [GAME-030, GAME-032, GAME-033, GAME-034, GAME-036]
    learn: how a form is checked on the server and shows friendly errors
  - id: journal.list
    feature: journal
    what: A page where a player sees the notes they wrote themselves.
    try_it: Join as Test Player 1 and Test Player 2 on two phones, and write a note on each. Each phone should list only its own notes. Never should one player see the other's note.
    needs: [journal.write]
    open: []
    area: player-app
    size: S
    level: easy
    safety_review: true
    rules: [GAME-031, SAFE-017]
    learn: how a page shows only the signed-in player's data
  - id: journal.sharing
    feature: journal
    what: Lets a player pick who can read a note, only me, shared with my name, or shared without my name. The form says in plain words who can see it.
    try_it: As Test Player 1, write a note and try each choice. The form should say that anonymous hides your name from players but organizers can still see it. A private note should never show for other players.
    needs: [journal.write]
    open: []
    area: player-app
    size: S
    level: medium
    safety_review: true
    rules: [GAME-031, SAFE-009, UI-031]
