[project]
name = "side-quest"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "pip-tools==7.6.2",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
# Protected agent tooling (AI-012, AI-022), not part of the app.
extend-exclude = [".claude", ".codex"]
