{# Join, step 2: PIN set (SAFE-021). The PIN is never sent back, so these fields always start empty. #}
<form class="form" method="post" action="/join" hx-post="/join" hx-target="#join-step">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="step" value="pin">
  <input type="hidden" name="first_name" value="{{ form.first_name }}">
  <input type="hidden" name="last_name" value="{{ form.last_name }}">
  <input type="hidden" name="church_id" value="{{ form.church_id }}">
  <input type="hidden" name="age_18_plus" value="{{ form.age_18_plus }}">
  {% if error %}{% include "partials/error.html" %}{% endif %}

  <p>Pick a {{ pin_digits }}-number PIN. You'll need it to log in on another phone, so pick one you'll remember.</p>

  <label for="pin">PIN</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{{ '{' }}{{ pin_digits }}{{ '}' }}" maxlength="{{ pin_digits }}" autocomplete="new-password" required>

  <label for="pin_again">PIN again</label>
  <input id="pin_again" name="pin_again" type="password" inputmode="numeric" pattern="[0-9]{{ '{' }}{{ pin_digits }}{{ '}' }}" maxlength="{{ pin_digits }}" autocomplete="new-password" required>

  <button class="button" type="submit">Join the game</button>
</form>
