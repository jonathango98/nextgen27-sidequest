<!doctype html>
<html lang="en">
<head>
  {% include "player/head.html" %}
  <title>{% block title %}Side Quest{% endblock %}</title>
</head>
<body>
  {# UI-030: same frame on every player page #}
  <header class="top-bar">
    <span class="score">{{ score }}</span>
    <span class="score-label">points</span>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <nav class="bottom-bar" aria-label="Main">
    <a href="/code">My Code</a>
    <a href="/scan">Scan</a>
    <a href="/quests">Quests</a>
  </nav>
</body>
</html>
