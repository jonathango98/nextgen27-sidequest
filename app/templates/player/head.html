{# Shared <head> for every player page. #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{# UI-004: load the display font early, from the same URL the CSS uses, so the browser reuses it. #}
<link rel="preload" href="/static/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
{# A fingerprint in each URL, so phones fetch new styles right after a deploy. #}
<link rel="stylesheet" href="{{ static_url('css/tokens.css') }}">
<link rel="stylesheet" href="{{ static_url('css/player.css') }}">
{# API-006 (htmx 2.0.11): swap in 4xx error partials, never 5xx. #}
<meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "4..", "swap": true, "error": true}, {"code": "...", "swap": false, "error": true}]}'>
<script src="{{ static_url('js/htmx.min.js') }}" defer></script>
